[package]
name = "ensemble-reaper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "REAPER OSC bridge for Ensemble — exposes REAPER transport, tracks and FX parameters as Ensemble actions"
repository = "https://github.com/samgwise/ensemble-reaper"
homepage = "https://github.com/samgwise/ensemble-reaper"
readme = "README.md"
keywords = ["music", "osc", "reaper", "daw", "real-time"]
categories = ["multimedia::audio", "command-line-utilities"]

[[bin]]
name = "ensemble-reaper"
path = "src/main.rs"

[dependencies]
ensemble-client = { version = "0.1.0", path = "../ensemble/ensemble-client" }
ensemble-core = { version = "0.1.0", path = "../ensemble/ensemble-core" }
rosc = "0.11"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[dev-dependencies]
ensemble-hub = { version = "0.1.0", path = "../ensemble/ensemble-hub" }
